name: mahakhanij_consumer
description: "Mahakhanij Consumer App 2.0 - Official Digital Minor Mineral Gateway for Maharashtra"
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ">=2.4.0 <3.0.0"

  # Routing & Navigation
  go_router: ">=12.0.0 <15.0.0"

  # Networking & REST API
  dio: ">=5.0.0 <6.0.0"

  # Local Persistence & Draft Auto-save
  shared_preferences: ">=2.1.0 <3.0.0"
  flutter_secure_storage: ">=8.0.0 <10.0.0"

  # Typography & Icons
  google_fonts: ">=5.0.0 <7.0.0"
  cupertino_icons: ">=1.0.6 <2.0.0"

  # QR Code & Scanning
  qr_flutter: ">=4.0.0 <5.0.0"
  mobile_scanner: ">=3.5.0 <6.0.0"

  # Utilities
  intl: ^0.20.3
  uuid: ">=3.0.0 <5.0.0"
  url_launcher: ">=6.1.0 <7.0.0"
  file_picker: "^8.0.0"
  pointycastle: "^3.7.3"
  flutter_localizations:
    sdk: flutter
  google_maps_flutter: ^2.18.2
  image_picker: ^1.2.3
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=2.0.0 <5.0.0"
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
